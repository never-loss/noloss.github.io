<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEVER LOSS</title>
<style>
  body { background:#0a0e17; color:#e6e6e6; font-family:sans-serif; padding:24px; text-align:center; }
  button { background:#2563eb; color:#fff; border:none; padding:14px 24px; border-radius:10px; font-size:16px; cursor:pointer; }
  button.secondary { background:#374151; margin-left:8px; }
  .card { background:#111827; border-radius:12px; padding:16px; margin:12px 0; text-align:left; }
  .warn { color:#f59e0b; font-size:13px; }
  .err { color:#f87171; font-size:13px; }
</style>
</head>
<body>
<h1>NEVER LOSS</h1>
<p id="status">A verificar sessão...</p>
<div id="login" style="display:none">
  <button onclick="connectToDeriv()">Connect to Deriv</button>
  <p class="warn">Plataforma de pesquisa e paper trading. Não garante lucros.</p>
</div>
<div id="app" style="display:none"></div>
<script>
// OAuth2 client_id from developers.deriv.com (also used as Deriv-App-ID for Options REST).
const APP_ID = '34t836m5r3AO3f7xavbvL';
const REDIRECT_URI = 'https://noloss-zeta.vercel.app/callback';
const SCOPE = 'trade';
const API_BASE = 'https://api.derivws.com';

function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(arr).map(v => chars[v % chars.length]).join('');
}
async function sha256Base64Url(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  const bytes = new Uint8Array(hash);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function connectToDeriv() {
  const verifier = randomString(64);
  const state = randomString(24);
  sessionStorage.setItem('nl_verifier', verifier);
  sessionStorage.setItem('nl_state', state);
  const challenge = await sha256Base64Url(verifier);
  const url = new URL('https://auth.deriv.com/oauth2/auth');
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('client_id', APP_ID);
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('scope', SCOPE);
  url.searchParams.set('state', state);
  url.searchParams.set('code_challenge', challenge);
  url.searchParams.set('code_challenge_method', 'S256');
  window.location.href = url.toString();
}
function disconnect() {
  sessionStorage.removeItem('nl_access_token');
  sessionStorage.removeItem('nl_verifier');
  sessionStorage.removeItem('nl_state');
  location.reload();
}
function authHeaders(token) {
  return {
    'Authorization': 'Bearer ' + token,
    'Deriv-App-ID': APP_ID,
    'Content-Type': 'application/json',
  };
}
function formatApiError(payload, status) {
  if (payload && Array.isArray(payload.errors) && payload.errors[0]) {
    const e = payload.errors[0];
    return (e.code || 'error') + ' - ' + (e.message || status);
  }
  if (payload && (payload.error_description || payload.error)) {
    return (payload.error || 'error') + ' - ' + (payload.error_description || status);
  }
  return 'HTTP ' + status;
}
async function loadAccount() {
  const token = sessionStorage.getItem('nl_access_token');
  const statusEl = document.getElementById('status');
  const loginEl = document.getElementById('login');
  const appEl = document.getElementById('app');
  if (!token) {
    statusEl.textContent = 'Não ligado.';
    loginEl.style.display = 'block';
    return;
  }
  statusEl.textContent = 'Ligado. A carregar contas...';
  try {
    // Modern Options API: list accounts via REST Bearer token.
    // Do NOT use public WS + { authorize: token } (legacy Binary WS flow).
    const resp = await fetch(API_BASE + '/trading/v1/options/accounts', {
      method: 'GET',
      headers: authHeaders(token),
    });
    const payload = await resp.json().catch(() => ({}));
    if (resp.status === 401) {
      sessionStorage.removeItem('nl_access_token');
      statusEl.innerHTML = 'Sessão expirada. Liga novamente.<br><span class="err">' + formatApiError(payload, resp.status) + '</span>';
      loginEl.style.display = 'block';
      return;
    }
    if (!resp.ok) {
      statusEl.innerHTML = 'Erro ao listar contas:<br><span class="err">' + formatApiError(payload, resp.status) + '</span>';
      loginEl.style.display = 'block';
      return;
    }
    const accounts = Array.isArray(payload.data) ? payload.data : [];
    statusEl.textContent = 'Ligado à Deriv.';
    let html = '';
    if (accounts.length === 0) {
      html += '<div class="card">Nenhuma conta Options encontrada nesta sessão. Completa o registo na Deriv ou cria uma conta demo no dashboard.</div>';
    } else {
      for (const acc of accounts) {
        const kind = acc.account_type === 'demo' ? '(DEMO)' : '(REAL)';
        const bal = (acc.balance != null ? acc.balance : '—') + ' ' + (acc.currency || '');
        html += '<div class="card"><b>' + (acc.account_id || '?') + '</b> ' + kind +
          '<br>Moeda: ' + (acc.currency || '—') +
          '<br>Saldo: <b>' + bal + '</b>' +
          '<br>Estado: ' + (acc.status || '—') + '</div>';
      }
    }
    html += '<p style="margin:16px 0"><a href="/dashboard.html" style="color:#38bdf8;font-weight:700">Abrir painel NEVER LOSS →</a></p>';
    html += '<button onclick="disconnect()">Desligar</button>';
    appEl.innerHTML = html;
    appEl.style.display = 'block';
    // Após carregar contas com sucesso, ir ao painel (OAuth/PKCE intacto).
    setTimeout(function () { window.location.href = '/dashboard.html'; }, 600);
  } catch (e) {
    statusEl.textContent = 'Erro: ' + e.message;
    loginEl.style.display = 'block';
  }
}
loadAccount();
</script>
</body>
</html>
