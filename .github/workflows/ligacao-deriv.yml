name: Ligacao Deriv
on: workflow_dispatch
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli/listen.ts --symbol 1HZ100V --pip 2 --max 50
