name: Paper trading
on: workflow_dispatch
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli/paper.ts --symbol 1HZ100V --rule paridade-inverte-3 --return 0.82 --stake 3 --minutes 10
