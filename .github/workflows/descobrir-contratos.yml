name: Descobrir contratos
on: workflow_dispatch
jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli/discover-contracts.ts --symbols cryBTCUSD,cryETHUSD,frxEURUSD,frxGBPUSD,frxUSDJPY,frxXAUUSD
