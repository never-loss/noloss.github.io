name: Pesquisa longa
on: workflow_dispatch
jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli/research-long.ts --symbol 1HZ100V --pages 5 --return 0.82 --return-high 8
