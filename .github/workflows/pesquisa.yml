name: Pesquisa
on: workflow_dispatch
jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli/research.ts --symbol 1HZ100V --count 5000 --return 0.82 --return-high 8
